# Server Configuration
server.port=${PORT:8080}

# MySQL Database Configuration (Configurable via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/project_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JSON Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Security & Error Handling (Do not leak stack traces or server internals)
server.error.include-stacktrace=never
server.error.include-message=never

# CORS Allowed Origins
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
